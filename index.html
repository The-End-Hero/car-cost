<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/car.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>car cost</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- 首屏主题：与 stores/theme 同 key，默认暗色，避免闪亮 -->
    <script>
      (function () {
        var key = "car-cost-theme";
        try {
          var raw = localStorage.getItem(key);
          var mode = raw ? (JSON.parse(raw).state?.mode) : null;
          if (mode !== "light") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
