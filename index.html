<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/car.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>car cost</title>
    <script>
      // Resolve theme synchronously before first paint to avoid light<->dark flash.
      // Priority: URL ?theme= > localStorage (zustand persist) > default "dark".
      // URL is read from BOTH search (?theme=) and hash query (#/path?theme=); search wins.
      // Mirrors the logic in src/hooks/useThemeMode.ts.
      (function () {
        var STORAGE_KEY = "car-cost-theme";
        function apply(mode) {
          if (mode === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-antd-theme", "dark");
          }
        }
        function parse(v) {
          return v === "dark" || v === "light" ? v : null;
        }
        function readUrlTheme() {
          try {
            var searchTheme = parse(
              new URLSearchParams(window.location.search).get("theme"),
            );
            if (searchTheme) return searchTheme;
          } catch (e) {}
          try {
            var hash = window.location.hash;
            var qIdx = hash.indexOf("?");
            if (qIdx >= 0) {
              var hashTheme = parse(
                new URLSearchParams(hash.slice(qIdx + 1)).get("theme"),
              );
              if (hashTheme) return hashTheme;
            }
          } catch (e) {}
          return null;
        }
        try {
          var urlTheme = readUrlTheme();
          if (urlTheme) {
            apply(urlTheme);
            return;
          }

          var raw = localStorage.getItem(STORAGE_KEY);
          var mode = null;
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state) mode = parsed.state.mode;
          }
          if (mode === "dark" || mode === "light") {
            apply(mode);
            return;
          }

          apply("dark"); // default
        } catch (e) {
          apply("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
